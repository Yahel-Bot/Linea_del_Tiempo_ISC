      transform-style: preserve-3d;

      will-change: transform;
      position: relative;

    /* Capa de reflejo dinámico que sigue el cursor */
    .card-glare {
      position: absolute;
      inset: 0;
      border-radius: 1rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      mix-blend-mode: overlay;
      z-index: 15;

    .timeline-card-3d:hover .card-glare {

  <!-- SCRIPT DE DATOS Y MOTOR DE INTERACCIÓN 3D / GSAP -->
  <script>
    // =========================================================================
    // 1. MOTOR DE AUDIO SINTÉTICO (Web Audio API)
    // =========================================================================
    let audioCtx = null;
    let audioEnabled = true;

    function playTone(freq, type = 'sine', duration = 0.08, gainVal = 0.05) {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn("Audio Context error:", e);
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById("audioIcon").innerText = audioEnabled ? "🔊" : "🔇";
      document.getElementById("audioLabel").innerText = audioEnabled ? "Sonido ON" : "Sonido OFF";
      if (audioEnabled) playTone(587.33, 'triangle', 0.12, 0.08);
    }

    // =========================================================================
    // 2. MOTOR GRÁFICO 3D THREE.JS (Fondo con Partículas y Artefactos en Movimiento)
    // =========================================================================
    let scene, camera, renderer, particles, floatingObjects = [];
    let mouseX = 0, mouseY = 0;

    function initThreeJS() {
      const canvas = document.getElementById("bg3dCanvas");
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 2000);
      camera.position.z = 800;

      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Nube de 1000 Partículas 3D con movimiento
      const particleGeo = new THREE.BufferGeometry();
      const particleCount = 1000;
      const posArray = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount * 3; i++) {
        posArray[i] = (Math.random() - 0.5) * 2000;
      }
      particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      const particleMat = new THREE.PointsMaterial({
        size: 2.5,
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.45,
        blending: THREE.AdditiveBlending
      });
      particles = new THREE.Points(particleGeo, particleMat);
      scene.add(particles);

      // Artefactos 3D temáticos flotantes
      // 1. Cilindro wireframe (Tubo de vacío Era 1)
      const cylGeo = new THREE.CylinderGeometry(40, 40, 100, 16, 4, true);
      const cylMat = new THREE.MeshBasicMaterial({ color: 0xc88648, wireframe: true, transparent: true, opacity: 0.35 });
      const cylMesh = new THREE.Mesh(cylGeo, cylMat);
      cylMesh.position.set(-600, 120, -100);
      scene.add(cylMesh);
      floatingObjects.push({ mesh: cylMesh, rotSpeedX: 0.005, rotSpeedY: 0.008 });

      // 2. Torus Wireframe (Carrete de cinta magnética Era 2)
      const torusGeo = new THREE.TorusGeometry(60, 12, 12, 36);
      const torusMat = new THREE.MeshBasicMaterial({ color: 0x4ade80, wireframe: true, transparent: true, opacity: 0.35 });
      const torusMesh = new THREE.Mesh(torusGeo, torusMat);
      torusMesh.position.set(-300, -150, -50);
      scene.add(torusMesh);
      floatingObjects.push({ mesh: torusMesh, rotSpeedX: 0.007, rotSpeedY: 0.004 });

      // 3. Icosaedro Wireframe (Microprocesador/Silicio Era 3)
      const icoGeo = new THREE.IcosahedronGeometry(65, 1);
      const icoMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b, wireframe: true, transparent: true, opacity: 0.35 });
      const icoMesh = new THREE.Mesh(icoGeo, icoMat);
      icoMesh.position.set(0, 160, -80);
      scene.add(icoMesh);
      floatingObjects.push({ mesh: icoMesh, rotSpeedX: 0.004, rotSpeedY: 0.006 });

      // 4. Caja Wireframe (Servidor en rack / Nube Era 4)
      const boxGeo = new THREE.BoxGeometry(85, 85, 85, 2, 2, 2);
      const boxMat = new THREE.MeshBasicMaterial({ color: 0x0284c7, wireframe: true, transparent: true, opacity: 0.35 });
      const boxMesh = new THREE.Mesh(boxGeo, boxMat);
      boxMesh.position.set(320, -130, -60);
      scene.add(boxMesh);
      floatingObjects.push({ mesh: boxMesh, rotSpeedX: 0.006, rotSpeedY: 0.005 });

      // 5. Dodecaedro Cuántico (Red Neuronal / IA Era 5)
      const dodecaGeo = new THREE.DodecahedronGeometry(75, 1);
      const dodecaMat = new THREE.MeshBasicMaterial({ color: 0x00f5d4, wireframe: true, transparent: true, opacity: 0.4 });
      const dodecaMesh = new THREE.Mesh(dodecaGeo, dodecaMat);
      dodecaMesh.position.set(650, 100, -50);
      scene.add(dodecaMesh);
      floatingObjects.push({ mesh: dodecaMesh, rotSpeedX: 0.008, rotSpeedY: 0.009 });

      // Eventos de Parallax con el Mouse
      window.addEventListener("mousemove", (e) => {
        mouseX = (e.clientX - window.innerWidth / 2) * 0.15;
        mouseY = (e.clientY - window.innerHeight / 2) * 0.15;
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animateThreeJS();
    }

    function animateThreeJS() {
      requestAnimationFrame(animateThreeJS);

      // Rotación suave de partículas y seguimiento de cámara
      if (particles) {
        particles.rotation.y += 0.0006;
        particles.rotation.x += 0.0003;
      }

      floatingObjects.forEach(obj => {
        obj.mesh.rotation.x += obj.rotSpeedX;
        obj.mesh.rotation.y += obj.rotSpeedY;
      });

      camera.position.x += (mouseX - camera.position.x) * 0.03;
      camera.position.y += (-mouseY - camera.position.y) * 0.03;
      camera.lookAt(scene.position);

      renderer.render(scene, camera);
    }

          },

            relevance: "Nace el principio sistémico esencial: una solución tecnológica no es una suma de piezas aisladas, sino una totalidad coordinada con propiedades emergentes.",

    // CAMBIAR MODO DE VISTA
    function setViewMode(mode) {
      currentViewMode = mode;
      currentCustomScreen = null;
      playTone(440, 'sine', 0.08);

      const btnPano = document.getElementById("viewBtnPanoramico");
      const btnEsce = document.getElementById("viewBtnEscenico");

      if (mode === "panoramico") {
        btnPano.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 bg-gradient-to-r from-amber-600/40 via-emerald-600/40 to-cyan-600/40 text-white border border-white/20 shadow-md";
        btnEsce.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition flex items-center gap-2";
      } else {
        btnEsce.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2 bg-gradient-to-r from-cyan-600/40 to-purple-600/40 text-white border border-white/20 shadow-md";
        btnPano.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition flex items-center gap-2";
      }

      renderCurrentView();
    }

    function renderCurrentView() {
      if (currentCustomScreen) {
        renderCustomScreen(currentCustomScreen);
        return;
      }
      if (currentViewMode === "panoramico") {
        renderPanoramicoView();
      } else {
        renderEscenicoView(currentStageIndex);
      }
    }

    // INCLINACIÓN 3D TÁCTIL EN HOVER (CARD TILT)
    function setup3DCardTilt() {
      const cards = document.querySelectorAll(".timeline-card-3d");
      cards.forEach(card => {
        const glare = card.querySelector(".card-glare");

        card.addEventListener("mousemove", (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          const rotateX = ((y - centerY) / centerY) * -12;
          const rotateY = ((x - centerX) / centerX) * 12;

          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.04, 1.04, 1.04)`;

          if (glare) {
            glare.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255,255,255,0.22), transparent 60%)`;
          }
        });

        card.addEventListener("mouseleave", () => {
          card.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)";
        });
      });
    }

    // ARRASTRE HORIZONTAL SUAVE CON INERCIA
    function setupSmoothDrag() {
      const scrollEl = document.getElementById("panoramicScroll");
      if (!scrollEl) return;

      let isDown = false;
      let startX, scrollLeft, velX = 0, momentumID;

      scrollEl.addEventListener("mousedown", (e) => {
        isDown = true;
        cancelAnimationFrame(momentumID);
        startX = e.pageX - scrollEl.offsetLeft;
        scrollLeft = scrollEl.scrollLeft;
      });

      scrollEl.addEventListener("mouseleave", () => { isDown = false; });
      scrollEl.addEventListener("mouseup", () => {
        isDown = false;
        // Inercia suave
        const momentumLoop = () => {
          if (Math.abs(velX) > 0.5) {
            scrollEl.scrollLeft += velX;
            velX *= 0.92;
            momentumID = requestAnimationFrame(momentumLoop);
          }
        };
        momentumLoop();
      });

      scrollEl.addEventListener("mousemove", (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - scrollEl.offsetLeft;
        const walk = (x - startX) * 1.5;
        velX = scrollLeft - (scrollLeft - (walk - (scrollEl.scrollLeft - scrollLeft)));
        velX = -(walk * 0.15);
        scrollEl.scrollLeft = scrollLeft - walk;
      });

      // Rueda del ratón horizontal suave
      scrollEl.addEventListener("wheel", (e) => {
        if (e.deltaY !== 0) {
          e.preventDefault();
          gsap.to(scrollEl, {
            scrollLeft: scrollEl.scrollLeft + e.deltaY * 2.2,
            duration: 0.45,
            ease: "power2.out"
          });
        }
      });
    }

    // =========================================================================
    // 9. MODAL DE DETALLE CON ANIMACIÓN GSAP FLUIDA (SIN POPUPS REPENTINOS)
    // =========================================================================
    function openModal(eraIdx, cardIdx) {
      playTone(660, 'sine', 0.08);
      const era = timelineData[eraIdx];
      const card = era.cards[cardIdx];

      document.getElementById("modalYear").innerText = card.year;
      document.getElementById("modalYear").style.color = card.badgeColor || era.accent;
      document.getElementById("modalTitle").innerText = card.title;
      document.getElementById("modalEvent").innerText = card.event;
      document.getElementById("modalRelevance").innerText = card.relevance;
      document.getElementById("modalAnalysis").innerText = card.analysis;

      const badge = document.getElementById("modalBadge");
      badge.innerText = `${card.badgeType} • ${card.sourceTag}`;
      badge.style.backgroundColor = (card.badgeColor || era.accent) + "25";
      badge.style.color = card.badgeColor || era.accent;
      badge.style.borderColor = (card.badgeColor || era.accent) + "65";

      const modalContainer = document.getElementById("detailModal");
      const modalBox = document.getElementById("modalBox");

      modalContainer.style.pointerEvents = "auto";

      // Animación fluida de apertura con GSAP
      gsap.killTweensOf([modalContainer, modalBox]);
      gsap.to(modalContainer, { opacity: 1, duration: 0.32, ease: "power2.out" });
      gsap.fromTo(modalBox, 
        { scale: 0.86, y: 35, opacity: 0, rotateX: 8 },
        { scale: 1, y: 0, opacity: 1, rotateX: 0, duration: 0.45, ease: "back.out(1.4)" }
      );
    }

    function closeModal() {
      playTone(330, 'sine', 0.06);
      const modalContainer = document.getElementById("detailModal");
      const modalBox = document.getElementById("modalBox");

      // Animación fluida de cierre con GSAP (cero apariciones bruscas)
      gsap.killTweensOf([modalContainer, modalBox]);
      gsap.to(modalBox, { scale: 0.9, y: 20, opacity: 0, duration: 0.22, ease: "power2.in" });
      gsap.to(modalContainer, { 
        opacity: 0, 
        duration: 0.24, 
        ease: "power2.in", 
        onComplete: () => {
          modalContainer.style.pointerEvents = "none";
        }
      });
    }

    // Cerrar al hacer clic en el backdrop exterior
    document.getElementById("detailModal").addEventListener("click", (e) => {
      if (e.target.id === "detailModal") {
        closeModal();
      }
    });

    // =========================================================================
    // 10. NAVEGACIÓN GLOBAL POR TECLADO
    // =========================================================================
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeModal();
      } else if (e.key === "ArrowRight") {
        if (currentViewMode === "escenico" && !currentCustomScreen) {
          nextStage();
        } else if (currentViewMode === "panoramico" && !currentCustomScreen) {
          const scrollEl = document.getElementById("panoramicScroll");
          if (scrollEl) {
            gsap.to(scrollEl, { scrollLeft: scrollEl.scrollLeft + 420, duration: 0.5, ease: "power2.out" });
          }
        }
      } else if (e.key === "ArrowLeft") {
        if (currentViewMode === "escenico" && !currentCustomScreen) {
          prevStage();
        } else if (currentViewMode === "panoramico" && !currentCustomScreen) {
          const scrollEl = document.getElementById("panoramicScroll");
          if (scrollEl) {
            gsap.to(scrollEl, { scrollLeft: scrollEl.scrollLeft - 420, duration: 0.5, ease: "power2.out" });
          }
        }
      } else if (["1", "2", "3", "4", "5"].includes(e.key)) {
        if (currentViewMode === "escenico") {
          currentCustomScreen = null;
          renderEscenicoView(parseInt(e.key) - 1);
        } else {
          scrollToEra(parseInt(e.key) - 1);
        }
      } else if (e.key.toLowerCase() === "p") {
        setViewMode("panoramico");
      } else if (e.key.toLowerCase() === "e") {
        setViewMode("escenico");
      } else if (e.key.toLowerCase() === "r") {
        switchScreen("reflexion");
      } else if (e.key.toLowerCase() === "l") {
        switchScreen("lente");
      } else if (e.key.toLowerCase() === "a") {
        switchScreen("analisis");
      }
    });
  </script>
